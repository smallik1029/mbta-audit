<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MBTA Live Prediction Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; height: 100%; background: #0f1115; }
  #map { position: absolute; inset: 0; }
  .panel {
    position: absolute; top: 12px; left: 12px; z-index: 1000;
    background: #171a21ee; border: 1px solid #2a2e38; border-radius: 10px;
    padding: 0.9rem 1.1rem; color: #e8e9ec; font-family: -apple-system, "Segoe UI", sans-serif;
    max-width: 300px;
  }
  .panel h1 { font-size: 1.05rem; margin: 0 0 0.4rem; }
  .panel p { font-size: 0.82rem; color: #9aa0ab; margin: 0.3rem 0; line-height: 1.4; }
  .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .status { font-size: 0.78rem; color: #9aa0ab; margin-top: 0.5rem; }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>MBTA Live Prediction Map</h1>
  <p><span class="legend-dot" style="background:#ffffff"></span>Solid = MBTA's raw predicted position</p>
  <p><span class="legend-dot" style="background:#ffffff; opacity:0.35"></span>Hollow/faint = bias-corrected position</p>
  <p>The gap between each pair is the correction in action, right now.</p>
  <div class="status" id="status">Loading...</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const ROUTE_COLORS = { Red: '#DA291C', Orange: '#ED8B00' };

const map = L.map('map', { zoomControl: true }).setView([42.3601, -71.0942], 13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  maxZoom: 19,
}).addTo(map);

let trainLayers = [];

function drawShapes(shapesByRoute) {
  for (const [route, polylines] of Object.entries(shapesByRoute)) {
    const color = ROUTE_COLORS[route] || '#888';
    for (const points of polylines) {
      L.polyline(points, { color, weight: 3, opacity: 0.55 }).addTo(map);
    }
  }
}

function refreshTrains() {
  fetch('/api/live_map')
    .then(r => r.json())
    .then(data => {
      trainLayers.forEach(l => map.removeLayer(l));
      trainLayers = [];

      if (data.error) {
        document.getElementById('status').textContent = 'Error: ' + data.error;
        return;
      }

      for (const t of data.trains) {
        const color = ROUTE_COLORS[t.route_id] || '#888';
        const raw = L.circleMarker(t.raw_pos, {
          radius: 6, color: '#fff', weight: 1.5, fillColor: color, fillOpacity: 1,
        }).addTo(map);
        const corrected = L.circleMarker(t.corrected_pos, {
          radius: 6, color: '#fff', weight: 1, fillColor: color, fillOpacity: 0.25,
        }).addTo(map);
        const line = L.polyline([t.raw_pos, t.corrected_pos], {
          color: '#fff', weight: 1, opacity: 0.4, dashArray: '2,4',
        }).addTo(map);
        trainLayers.push(raw, corrected, line);
      }

      const now = new Date().toLocaleTimeString();
      document.getElementById('status').textContent =
        `${data.trains.length} active trains \u2014 updated ${now}`;
    })
    .catch(() => {
      document.getElementById('status').textContent = 'Failed to fetch live data.';
    });
}

fetch('/api/shapes')
  .then(r => r.json())
  .then(drawShapes);

refreshTrains();
setInterval(refreshTrains, 5000);
</script>
</body>
</html>
