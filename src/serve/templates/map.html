<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MBTA Live Prediction Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; height: 100%; background: #0f1115; }
  #map { position: absolute; inset: 0; }
  .panel {
    position: absolute; top: 12px; left: 12px; z-index: 1000;
    background: #171a21ee; border: 1px solid #2a2e38; border-radius: 10px;
    padding: 0.9rem 1.1rem; color: #e8e9ec; font-family: -apple-system, "Segoe UI", sans-serif;
    max-width: 300px;
  }
  .panel h1 { font-size: 1.05rem; margin: 0 0 0.4rem; }
  .panel p { font-size: 0.82rem; color: #9aa0ab; margin: 0.3rem 0; line-height: 1.4; }
  .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .status { font-size: 0.78rem; color: #9aa0ab; margin-top: 0.5rem; }
  .train-tooltip {
    background: #171a21; color: #e8e9ec; border: 1px solid #2a2e38;
    border-radius: 8px; font-family: -apple-system, "Segoe UI", sans-serif;
    font-size: 0.82rem; padding: 0.5rem 0.7rem; line-height: 1.5;
  }
  .train-tooltip b { color: #fff; }
  .train-tooltip .later { color: #ED8B00; }
  .train-tooltip .earlier { color: #4caf50; }
  .leaflet-tooltip-top.train-tooltip::before { border-top-color: #2a2e38; }
  .time-panel {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    z-index: 1000; background: #171a21ee; border: 1px solid #2a2e38; border-radius: 10px;
    padding: 0.8rem 1.2rem; color: #e8e9ec; font-family: -apple-system, "Segoe UI", sans-serif;
    width: min(520px, 90vw); text-align: center;
  }
  .time-panel .label { font-size: 0.85rem; color: #9aa0ab; margin-bottom: 0.5rem; }
  .time-panel .label b { color: #e8e9ec; }
  .time-row { display: flex; align-items: center; gap: 0.8rem; }

  .time-row input[type="range"] {
    flex: 1;
    direction: rtl;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    height: 16px;
  }
  .time-row input[type="range"]::-webkit-slider-runnable-track {
    height: 2px;
    background: #3a3f4b;
    border-radius: 1px;
  }
  .time-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 15px; height: 15px;
    margin-top: -6.5px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid #DA291C;
    cursor: pointer;
  }
  .time-row input[type="range"]::-moz-range-track {
    height: 2px;
    background: #3a3f4b;
    border-radius: 1px;
  }
  .time-row input[type="range"]::-moz-range-thumb {
    width: 15px; height: 15px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid #DA291C;
    cursor: pointer;
  }

  .live-btn {
    background: #1f232c; color: #e8e9ec; border: 1px solid #2a2e38;
    border-radius: 6px; padding: 0.35rem 0.8rem; font-size: 0.8rem; cursor: pointer;
  }
  .live-btn.is-live { background: #2e7d32; border-color: #2e7d32; color: #fff; cursor: default; }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>MBTA Live Prediction Map</h1>
  <p><span class="legend-dot" style="background:#ffffff"></span>Solid = MBTA's official time</p>
  <p><span class="legend-dot" style="background:#ffffff; opacity:0.35"></span>Hollow/faint = Our estimated time</p>
  <p>Hover a dot for details. The gap between each pair is the correction in action, right now.</p>
  <button class="live-btn is-live" id="connectorToggle" style="margin-top: 0.3rem;">Connectors: On</button>
  <div class="status" id="status">Loading...</div>
</div>

<div class="time-panel">
  <div class="label" id="timeLabel">Live</div>
  <div class="time-row">
    <input type="range" id="timeSlider" min="0" max="1440" step="any" value="0">
    <button class="live-btn is-live" id="liveBtn">Live</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const ROUTE_COLORS = { Red: '#DA291C', Orange: '#ED8B00', Blue: '#003DA5' };

const map = L.map('map', { zoomControl: true });
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  maxZoom: 19,
}).addTo(map);

let trainLayers = [];
let boundsFitted = false;

function drawShapes(shapesByRoute) {
  const allPoints = [];
  for (const [route, polylines] of Object.entries(shapesByRoute)) {
    const color = ROUTE_COLORS[route] || '#888';
    for (const points of polylines) {
      L.polyline(points, { color, weight: 3, opacity: 0.55 }).addTo(map);
      allPoints.push(...points);
    }
  }
  if (allPoints.length && !boundsFitted) {
    const bounds = L.latLngBounds(allPoints).pad(0.03);
    map.fitBounds(bounds);
    map.setMinZoom(map.getZoom());
    map.setMaxBounds(map.getBounds().pad(0.05));
    boundsFitted = true;
  }
}

function drawStations(stations) {
  for (const s of stations) {
    const marker = L.circleMarker([s.lat, s.lon], {
      radius: 8, color: '#454b58', weight: 1.5, fillColor: '#d8dbe2', fillOpacity: 0.95,
    }).addTo(map);
    marker.bindTooltip(s.stop_name, { className: 'train-tooltip', direction: 'top' });
  }
}

const CONFIDENCE_LABELS = {
  stop: "this stop's history",
  route: "this line's history",
  global: 'system-wide history',
  none: 'no history available',
};

function adjustmentSentence(adjustmentSec, confidence, sampleSize) {
  const basis = CONFIDENCE_LABELS[confidence] || confidence;
  const n = sampleSize.toLocaleString();
  if (adjustmentSec === 0) {
    return `We agree with MBTA's time, based on ${basis} (${n} past observations).`;
  }
  const direction = adjustmentSec > 0 ? 'later' : 'earlier';
  const cls = adjustmentSec > 0 ? 'later' : 'earlier';
  return `We think it'll actually arrive <span class="${cls}"><b>${Math.abs(adjustmentSec)}s ${direction}</b></span> than MBTA says, based on ${basis} (${n} past observations).`;
}

function tooltipHtml(t, kind) {
  const time = kind === 'raw' ? t.raw_min : t.corrected_min;
  return `
    <b>${t.route_id} Line</b> &rarr; ${t.headsign}<br>
    Next stop: ${t.next_stop_name}<br>
    <br>
    MBTA's official time: ${t.raw_min.toFixed(1)} min<br>
    Our estimated time: <b>${t.corrected_min.toFixed(1)} min</b><br>
    ${adjustmentSentence(t.adjustment_sec, t.confidence, t.sample_size)}<br>
    <br>
    <i>Showing: ${kind === 'raw' ? "MBTA's official time" : "our estimated time"} (${time.toFixed(1)} min out)</i>
  `;
}

function curvedLatLngs(latlng0, latlng1, offsetPx) {
  const p0 = map.latLngToLayerPoint(latlng0);
  const p1 = map.latLngToLayerPoint(latlng1);
  const dx = p1.x - p0.x, dy = p1.y - p0.y;
  const len = Math.sqrt(dx * dx + dy * dy) || 1;
  const nx = -dy / len, ny = dx / len; // unit perpendicular
  const midX = (p0.x + p1.x) / 2 + nx * offsetPx;
  const midY = (p0.y + p1.y) / 2 + ny * offsetPx;

  const points = [];
  const steps = 16;
  for (let i = 0; i <= steps; i++) {
    const s = i / steps;
    const x = (1 - s) * (1 - s) * p0.x + 2 * (1 - s) * s * midX + s * s * p1.x;
    const y = (1 - s) * (1 - s) * p0.y + 2 * (1 - s) * s * midY + s * s * p1.y;
    points.push(map.layerPointToLatLng(L.point(x, y)));
  }
  return points;
}

let lastTrains = [];
let connectorLayers = [];
let showConnectors = true;

function drawConnectors() {
  connectorLayers.forEach(l => map.removeLayer(l));
  connectorLayers = [];
  if (!showConnectors) return;

  for (const t of lastTrains) {
    const curve = L.polyline(curvedLatLngs(t.raw_pos, t.corrected_pos, 14), {
      color: '#fff', weight: 4, opacity: 0.9,
    }).addTo(map);
    curve.bringToBack(); // under the dots, on top of the track/stations
    connectorLayers.push(curve);
  }
}

function renderTrains(trains) {
  lastTrains = trains;
  trainLayers.forEach(l => map.removeLayer(l));
  trainLayers = [];

  for (const t of trains) {
    const color = ROUTE_COLORS[t.route_id] || '#888';
    const raw = L.circleMarker(t.raw_pos, {
      radius: 8, color: '#fff', weight: 2.5, fillColor: color, fillOpacity: 1,
    }).addTo(map);
    raw.bindTooltip(tooltipHtml(t, 'raw'), { className: 'train-tooltip', direction: 'top', sticky: true });

    const corrected = L.circleMarker(t.corrected_pos, {
      radius: 7, color: '#fff', weight: 1.5, fillColor: color, fillOpacity: 0.3,
    }).addTo(map);
    corrected.bindTooltip(tooltipHtml(t, 'corrected'), { className: 'train-tooltip', direction: 'top', sticky: true });

    raw.bringToFront();
    corrected.bringToFront();
    trainLayers.push(raw, corrected);
  }

  drawConnectors();
}

let isLive = true;

let latestRequestId = 0;

function refreshTrains() {
  if (!isLive) return; 
  const requestId = ++latestRequestId;
  fetch('/api/live_map')
    .then(r => r.json())
    .then(data => {
      if (requestId !== latestRequestId) return; 
      if (data.error) {
        document.getElementById('status').textContent = 'Error: ' + data.error;
        return;
      }
      renderTrains(data.trains);
      const now = new Date().toLocaleTimeString();
      document.getElementById('status').textContent =
        `${data.trains.length} active trains tracked | updated ${now}`;
    })
    .catch(() => {
      if (requestId !== latestRequestId) return;
      document.getElementById('status').textContent = 'Failed to fetch live data.';
    });
}

function fetchHistorical(t) {
  const requestId = ++latestRequestId;
  const url = '/api/historical_map?t=' + encodeURIComponent(t.toISOString());
  fetch(url)
    .then(r => r.json())
    .then(data => {
      if (requestId !== latestRequestId) return; 
      if (data.error) {
        document.getElementById('status').textContent = 'Error: ' + data.error;
        return;
      }
      renderTrains(data.trains);
      document.getElementById('status').textContent =
        `${data.trains.length} trains | as of ${t.toLocaleString()}`;
    })
    .catch(() => {
      if (requestId !== latestRequestId) return;
      document.getElementById('status').textContent = 'Failed to fetch historical data.';
    });
}

const slider = document.getElementById('timeSlider');
const liveBtn = document.getElementById('liveBtn');
const timeLabel = document.getElementById('timeLabel');
let debounceHandle = null;

const MAX_CAP_MIN = 1440; // 24h ceiling -- stops growing once real data reaches this

function formatAgo(minutesAgo) {
  const hours = Math.floor(minutesAgo / 60);
  const mins = minutesAgo % 60;
  if (hours === 0) return `${mins} min ago`;
  if (mins === 0) return `${hours} hr ago`;
  return `${hours} hr ${mins} min ago`;
}

function setLiveMode(live) {
  isLive = live;
  liveBtn.classList.toggle('is-live', live);
  liveBtn.textContent = live ? 'Live' : 'Go Live';
  if (live) {
    slider.value = 0;
    timeLabel.innerHTML = 'Live';
    refreshTrains();
  }
}

slider.addEventListener('input', () => {
  const minutesAgo = parseInt(slider.value, 10);
  const t = new Date(Date.now() - minutesAgo * 60_000);
  isLive = (minutesAgo === 0);
  liveBtn.classList.toggle('is-live', isLive);
  liveBtn.textContent = isLive ? 'Live' : 'Go Live';
  timeLabel.innerHTML = minutesAgo === 0
    ? 'Live'
    : `<b>${t.toLocaleString()}</b> (${formatAgo(minutesAgo)})`;

  clearTimeout(debounceHandle);
  debounceHandle = setTimeout(() => {
    if (minutesAgo === 0) {
      refreshTrains();
    } else {
      fetchHistorical(t);
    }
  }, 250);
});

liveBtn.addEventListener('click', () => setLiveMode(true));

const connectorToggle = document.getElementById('connectorToggle');
connectorToggle.addEventListener('click', () => {
  showConnectors = !showConnectors;
  connectorToggle.classList.toggle('is-live', showConnectors);
  connectorToggle.textContent = showConnectors ? 'Connectors: On' : 'Connectors: Off';
  drawConnectors(); // redraw immediately from cached data, no new fetch needed
});

function updateSliderCap() {
  fetch('/api/data_range')
    .then(r => r.json())
    .then(data => {
      if (data.error || !data.earliest) return;
      const earliest = new Date(data.earliest);
      const availableMin = Math.floor((Date.now() - earliest.getTime()) / 60_000);
      slider.max = Math.max(5, Math.min(MAX_CAP_MIN, availableMin));
    })
    .catch(() => { /* keep whatever cap is already set */ });
}

fetch('/api/shapes')
  .then(r => r.json())
  .then(drawShapes)
  .then(() => fetch('/api/stations'))
  .then(r => r.json())
  .then(drawStations);

updateSliderCap();
setInterval(updateSliderCap, 60_000); // grows as more history accumulates, stops at 24h

refreshTrains();
setInterval(refreshTrains, 5000);
</script>
</body>
</html>
