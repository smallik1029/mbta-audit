<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2e38;
    --text: #e8e9ec; --muted: #9aa0ab;
    --ok: #2e9e5b; --warn: #ED8B00; --bad: #DA291C; --idle: #5a6172;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 0 4vw 4rem;
  }
  .topnav {
    height: 52px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; gap: 3rem;
    margin: 0 -4vw 2.5rem;
  }
  .topnav a {
    position: relative; color: var(--muted); text-decoration: none; font-weight: 600;
    font-size: 0.9rem; padding: 0.4rem 0.1rem; transition: color 0.2s ease;
  }
  .topnav a::after {
    content: ''; position: absolute; left: 50%; bottom: -2px; height: 2px; width: 100%;
    background: #DA291C; transform: translateX(-50%) scaleX(0); transition: transform 0.25s ease;
  }
  .topnav a.active::after, .topnav a:hover::after { transform: translateX(-50%) scaleX(1); }
  .topnav a:hover { color: var(--text); }
  .wrap { max-width: 820px; margin: 0 auto; }
  .banner {
    display: flex; align-items: center; gap: 0.7rem;
    border-radius: 10px; padding: 0.9rem 1.2rem; font-weight: 600; font-size: 1.05rem;
    color: #fff; background: var(--ok);
  }
  .banner.degraded { background: var(--warn); }
  .banner.down { background: var(--bad); }
  .generated { color: var(--muted); font-size: 0.85rem; margin: 0.75rem 0 2rem; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 0.4rem 1.2rem; margin-bottom: 1.5rem;
  }
  .component {
    display: flex; align-items: center; gap: 0.8rem;
    padding: 0.95rem 0; border-bottom: 1px solid var(--border);
  }
  .component:last-child { border-bottom: none; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: var(--ok); }
  .dot.degraded { background: var(--warn); }
  .dot.down { background: var(--bad); }
  .dot.idle { background: var(--idle); }
  .component .name { font-weight: 600; font-size: 0.95rem; }
  .component .detail { margin-left: auto; color: var(--muted); font-size: 0.85rem; text-align: right; }
  h2 { font-size: 1rem; font-weight: 600; margin: 0 0 0.9rem; }
  .series { margin-bottom: 1.5rem; }
  .series-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 1rem; margin-bottom: 0.7rem;
  }
  .series-head .title { font-weight: 600; font-size: 0.95rem; }
  .series-head .avg { color: var(--muted); font-size: 0.82rem; }
  .bars { display: flex; gap: 2px; align-items: flex-end; height: 38px; }
  .bar {
    flex: 1; height: 100%; border-radius: 2px; background: var(--ok);
    min-width: 3px; cursor: default; transition: filter 0.12s ease;
  }
  .bar:hover { filter: brightness(1.35); }
  .bar.partial { background: var(--warn); }
  .bar.bad { background: var(--bad); }
  .bar.nodata { background: #262a33; }
  .bars-legend {
    display: flex; justify-content: space-between;
    color: var(--muted); font-size: 0.78rem; margin-top: 0.55rem;
  }
  .series-note { color: var(--muted); font-size: 0.78rem; margin-top: 0.5rem; }
  .acc-table { width: 100%; border-collapse: collapse; }
  .acc-table th, .acc-table td {
    text-align: left; padding: 0.6rem 0.2rem; border-bottom: 1px solid var(--border);
  }
  .acc-table th {
    color: var(--muted); font-weight: 500; font-size: 0.76rem; text-transform: uppercase;
  }
  .acc-table tbody tr:last-child td { border-bottom: none; }
  .acc-table .gain { color: var(--ok); font-weight: 600; }
  .acc-table .loss { color: var(--bad); font-weight: 600; }
  .tag {
    font-size: 0.7rem; color: var(--muted); background: #1f232c;
    border: 1px solid var(--border); border-radius: 999px;
    padding: 0.1rem 0.5rem; margin-left: 0.45rem; white-space: nowrap;
  }
  .caption { color: var(--muted); font-size: 0.8rem; margin: 0.9rem 0 0; line-height: 1.5; }
  .acc-table th [data-tip] {
    border-bottom: 1px dotted #5a6172; cursor: help; padding-bottom: 1px;
  }
  .stat .label span[data-tip] {
    border-bottom: 1px dotted #5a6172; cursor: help; padding-bottom: 1px;
  }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1px; }
  .stat { padding: 1rem 0.2rem; }
  .stat .label { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.3rem; }
  .stat .value { font-size: 1.25rem; font-weight: 600; }
  .footnote {
    color: var(--muted); font-size: 0.82rem; line-height: 1.55; margin-top: 1.75rem;
    padding-left: 0.85rem; border-left: 2px solid #3a3f4b; max-width: 620px;
  }
  .baltip {
    position: absolute; z-index: 60; display: none; pointer-events: none;
    background: #1f232c; border: 1px solid #3a3f4b; border-radius: 8px;
    padding: 0.5rem 0.7rem; font-size: 0.82rem; line-height: 1.45;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.5); white-space: nowrap;
  }
  .baltip.wide { width: max-content; max-width: 250px; white-space: normal; font-weight: 400; }
  .baltip .when { font-weight: 600; margin-bottom: 0.1rem; }
  .baltip .what { color: var(--muted); }
  .baltip::after {
    content: ''; position: absolute; left: 50%; bottom: -5px; margin-left: -4px;
    width: 8px; height: 8px; background: #1f232c;
    border-right: 1px solid #3a3f4b; border-bottom: 1px solid #3a3f4b;
    transform: rotate(45deg);
  }
  .baltip.below::after {
    top: -5px; bottom: auto; border: none;
    border-left: 1px solid #3a3f4b; border-top: 1px solid #3a3f4b;
  }
  @media (max-width: 640px) {
    .component { flex-wrap: wrap; gap: 0.5rem; }
    .component .detail { margin-left: 0; width: 100%; text-align: left; }
  }
</style>
</head>
<body>
<nav class="topnav">
  <a href="/">Live Map</a>
  <a href="/corrector">Single-Stop Lookup</a>
  <a href="/accuracy" class="active">Accuracy</a>
  <a href="/status">Status</a>
</nav>
<div class="wrap">
  <p class="generated" id="generated"></p>

  <h2>Measured accuracy</h2>
  <div class="card" style="padding: 0.4rem 1.2rem 1.2rem;">
    <table class="acc-table">
      <thead>
        <tr>
          <th><span data-tip="One row per line. The four Green Line branches are measured separately because they behave differently. A line tagged not applied is served with MBTA's own time.">Route</span></th>
          <th><span data-tip="How far off the MBTA's own prediction was from the real arrival. This is the middle value, so half of their predictions were closer and half were further off.">MBTA's error</span></th>
          <th><span data-tip="The same measurement, but for our corrected estimate. A smaller number here means we landed closer to the real arrival than the MBTA did.">Our error</span></th>
          <th><span data-tip="How much of the MBTA's error our correction removes. Negative means their time was closer than ours, so we show theirs instead.">Improvement</span></th>
        </tr>
      </thead>
      <tbody id="accuracyBody"></tbody>
    </table>
    <p class="caption" id="accuracyCaption"></p>
  </div>

  <h2>By the numbers</h2>
  <div class="card"><div class="stats" id="stats"></div></div>

  <p class="footnote" id="footnote"></p>
</div>
<div class="baltip" id="baltip"></div>

<script>
const baltip = document.getElementById('baltip');

function showUnavailable() {
  document.getElementById('accuracyCaption').textContent =
    'Accuracy figures are unavailable right now.';
}

function positionTip(el) {
  baltip.style.display = 'block';
  const b = el.getBoundingClientRect();
  const t = baltip.getBoundingClientRect();
  let left = b.left + b.width / 2 - t.width / 2 + window.scrollX;
  left = Math.max(8, Math.min(left, document.documentElement.clientWidth - t.width - 8));
  baltip.style.left = Math.round(left) + 'px';
  if (b.top - t.height - 9 < 4) {
    baltip.classList.add('below');
    baltip.style.top = Math.round(b.bottom + 9 + window.scrollY) + 'px';
  } else {
    baltip.classList.remove('below');
    baltip.style.top = Math.round(b.top - t.height - 9 + window.scrollY) + 'px';
  }
}

function hideTip() {
  baltip.style.display = 'none';
}

function showTextTip(el) {
  baltip.className = 'baltip wide';
  baltip.textContent = el.dataset.tip;
  positionTip(el);
}

document.addEventListener('mouseover', (e) => {
  const labelled = e.target.closest('[data-tip]');
  if (labelled) showTextTip(labelled);
});

document.addEventListener('mouseout', (e) => {
  if (e.target.closest('[data-tip]')) hideTip();
});

document.addEventListener('click', (e) => {
  const labelled = e.target.closest('[data-tip]');
  if (labelled) {
    showTextTip(labelled);
    return;
  }
  hideTip();
});

window.addEventListener('scroll', hideTip, { passive: true });

fetch('/api/accuracy')
  .then(r => r.json())
  .then(d => {
    if (d.error || !d.accuracy || !d.accuracy.routes.length) {
      showUnavailable();
      return;
    }
    document.getElementById('generated').textContent = 'Measured daily. Page loaded ' + d.generated_at + '.';

        document.getElementById('accuracyBody').innerHTML = d.accuracy.routes.map(r => {
      const cls = r.improvement_pct >= 0 ? 'gain' : 'loss';
      const sign = r.improvement_pct >= 0 ? '+' : '';
      const tag = r.applied ? '' : '<span class="tag">not applied</span>';
      return `<tr>
        <td>${r.route_id}${tag}</td>
        <td>${r.baseline_sec.toFixed(1)}s</td>
        <td>${r.corrected_sec.toFixed(1)}s</td>
        <td class="${cls}">${sign}${r.improvement_pct.toFixed(1)}%</td>
      </tr>`;
    }).join('');
    const o = d.accuracy.overall;
    const overallLine = o
      ? `Overall ${o.baseline_sec.toFixed(1)}s down to ${o.corrected_sec.toFixed(1)}s, ` +
        `${o.improvement_pct >= 0 ? '+' : ''}${o.improvement_pct.toFixed(1)}%. `
      : '';
    document.getElementById('accuracyCaption').textContent = overallLine +
      'Median absolute error on ' + d.accuracy.test_rows.toLocaleString() +
      ' held-out rows the model was never fit on' +
      (d.accuracy.max_lead_min ? ', counting only the predictions the site serves, under ' +
        d.accuracy.max_lead_min + ' minutes out' : '') +
      '. Measured ' + d.accuracy.measured_on + ' (' + d.accuracy.measured_age + ').';

    document.getElementById('stats').innerHTML = d.stats.map(s => `
      <div class="stat">
        <div class="label">${s.tip ? `<span data-tip="${s.tip}">${s.label}</span>` : s.label}</div>
        <div class="value">${s.value}</div>
      </div>
    `).join('');

    document.getElementById('footnote').textContent =
      'Accuracy is remeasured after every nightly retrain, on a held-out slice of data the model ' +
      'was never fit on. The split is chronological rather than random, and the test window is ' +
      'removed from the training data before the evaluated model is built, so these figures ' +
      'describe predictions the model had not seen.';
  })
  .catch(showUnavailable);
</script>
</body>
</html>
